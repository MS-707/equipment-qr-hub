<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is required: the design system pads against
         env(safe-area-inset-*) and without it the bottom inset collapses on
         notched iPhones. Carried over from src/app/layout.tsx. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0A" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="description" content="Pre-trip inspections for Mytra field equipment." />
    <meta name="format-detection" content="telephone=no" />
    <title>Sage | EHS</title>
    <!--
      PRE-HYDRATION THEME STAMP (DS-2).

      Ported verbatim from the inline <script> in src/app/layout.tsx. It runs
      synchronously in <head>, before the body paints, so the stored theme is on
      documentElement for the very first frame. A flash of the wrong theme is a
      defect, not a cosmetic nit — moving this into React would reintroduce it.

      The locale branch is carried across faithfully as well. KIN-8 (English-only
      port) will revisit it once the es bundle is emptied; it is deliberately
      unchanged here so this task ports the shell rather than redesigning it.
    -->
    <script>
      (function(){try{var l=localStorage.getItem('sage-locale-v2');if(l==='es'){document.documentElement.lang='es'}var t=localStorage.getItem('sage-theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t}else{var d=matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=d?'dark':'light'}}catch(e){document.documentElement.dataset.theme='dark'}})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
