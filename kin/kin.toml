# Sage EHS — Kin app descriptor.
#
# Kin provisions and deploys the Worker; this file is a git-tracked record of
# what the app IS, so the repo stays the source of truth alongside the control
# plane. It is archived with every deploy's source manifest. It is not a
# wrangler config and Kin does not read it to provision anything.

slug = "sage-ehs"
name = "Sage EHS"
region = "WNAM"
app_id = "4a1e7a91-b8bb-4415-b05f-d37fe0e91e6b"

# Created with needs_database = true: pre-trip inspections, permits, JHA/PTP and
# incident reports become rows other people can see, replacing the localStorage
# store in the Vercel app.
needs_database = true

[hostnames]
preview = "preview-sage-ehs.mkin.app"
live = "sage-ehs.mkin.app"

[bundle]
# The deployable Worker: a single self-contained ES module, no imports.
entry = "kin/worker/index.js"

[assets]
# The SPA. kin/scripts/kin-build.mjs runs Vite (kin/vite.config.ts, root
# kin/src) into kin/dist, then kin-assets.mjs hashes the result. JS and CSS land
# under kin/dist/assets/ with content-hashed filenames, which the Worker serves
# `immutable`. The scaffold shell that used to live in kin/public was replaced
# by the real index.html in KIN-M0-T5; kin-build still stages a kin/public
# directory if one reappears, without ever overwriting build output.
source = "kin/src"
dist = "kin/dist"
manifest = "kin/dist/asset-manifest.json"

[secrets]
# Values are entered by the owner in the Kin portal and read at runtime with
# `await env.KIN.getSecret(env.KIN_APP_ID, 'NAME')`. Never stored in the repo.
required = ["RESEND_API_KEY", "EHS_NOTIFY_EMAIL", "EHS_NOTIFY_FROM"]
planned = ["ANTHROPIC_API_KEY", "NOTION_API_KEY", "SLACK_WEBHOOK_URL"]
